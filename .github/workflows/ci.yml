name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # overrides .cargo/config.toml (target-cpu=native): rust-cache restores builds across runners with different CPUs, and native code from another CPU can crash
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    defaults:
      run:
        working-directory: pipeline/rail-extract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline/rail-extract
      # .cargo/config.toml builds with target-cpu=native: fine here, the runner builds and runs on the same machine
      # config validity is covered here: cargo test runs config.rs every_shipped_region_config_has_only_known_keys
      - run: cargo test --release
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo fmt --check

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      # VITE_DATA_BASE is left unset: the app falls back to its local data path. The Vercel build runs scripts/check-deploy.mjs separately.
      - run: npm run build
